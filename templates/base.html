<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Connect Me{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Connect Me</a>
    {% if current_user.is_authenticated %}
    <nav>
      <a href="{{ url_for('browse') }}">Browse</a>
      <a href="{{ url_for('edit_profile') }}">My profile</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link">Log out ({{ current_user.username }})</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
